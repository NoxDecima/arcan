# .github/workflows/android.yml
name: android

on:
  push:
    branches: [main]
    tags: ["android-v*"]
  pull_request:
    paths:
      - "src/**"
      - "src-tauri/**"
      - "gen/android/**"
      - "package.json"
      - ".github/workflows/android.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: sdkmanager "ndk;27.0.12077973"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: npm install
        run: npm ci

      - name: Initialize Android project (if not committed)
        # gen/android is generated by `tauri android init` and should be committed
        # (with signing wiring per docs/android-signing.md) before release tags.
        # On PRs and main pushes the CI-generated project is unsigned — the build
        # still compiles but the APK is not installable without signing.
        run: |
          if [ ! -d gen/android ]; then
            npx tauri android init --ci
          fi

      - name: Verify signing wiring for release tags
        # If secrets are set but the committed gen/android does not reference
        # keystore.properties, a release would silently ship unsigned.
        # Fail loudly so the prerequisite is obvious.
        if: startsWith(github.ref, 'refs/tags/android-v')
        run: |
          GRADLE_KTS="gen/android/app/build.gradle.kts"
          if [ ! -f "$GRADLE_KTS" ]; then
            echo "ERROR: $GRADLE_KTS not found."
            echo "Run 'tauri android init' in your nix shell, wire signing per docs/android-signing.md,"
            echo "then commit gen/android before pushing a release tag."
            exit 1
          fi
          if ! grep -q "keystore.properties" "$GRADLE_KTS"; then
            echo "ERROR: $GRADLE_KTS does not reference keystore.properties."
            echo "Signing is not wired into the Gradle project."
            echo "Follow the 'One-time: wire signing into the generated Gradle project' section in"
            echo "docs/android-signing.md, then commit the updated gen/android before pushing a release tag."
            exit 1
          fi
          echo "Signing wiring check PASSED — keystore.properties referenced in build.gradle.kts."

      - name: Decode signing keystore
        if: startsWith(github.ref, 'refs/tags/android-v')
        run: |
          echo "$ANDROID_KEYSTORE_B64" | base64 -d > gen/android/keystore.jks
          cat > gen/android/keystore.properties <<EOF
          storeFile=keystore.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Build APK
        # NOTE: The exact APK output path can differ by Tauri CLI version.
        # After the first CI run, check the build log and correct the path:
        #   globs below → gen/android/app/build/outputs/apk/universal/release/*.apk
        # Tauri 2 may use a different variant directory (e.g. arm64-v8a, debug).
        run: npm run tauri android build -- --apk
        env:
          NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/27.0.12077973
          VITE_ARCAN_ORIGIN: ${{ vars.ARCAN_ORIGIN }}

      - uses: actions/upload-artifact@v4
        with:
          name: arcan-apk
          # NOTE: verify this path after the first CI run — see Build APK note above.
          path: gen/android/app/build/outputs/apk/universal/release/*.apk

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/android-v')
        uses: softprops/action-gh-release@v2
        with:
          # NOTE: verify this path after the first CI run — see Build APK note above.
          files: gen/android/app/build/outputs/apk/universal/release/*.apk
          generate_release_notes: true
