services:
  caddy:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.caddy
    restart: unless-stopped
    ports:
      - "80:80"     # HTTP-01 challenge + redirect to HTTPS
      - "443:443"   # HTTPS + WSS
    volumes:
      - caddy_data:/data      # ACME state, issued certs — must persist
      - caddy_config:/config  # Caddy runtime config cache
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    depends_on:
      - sync
      - api

  sync:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.sync
    restart: unless-stopped
    volumes:
      - ./data:/data          # SQLite file on the host for easy inspection / manual backup
    # NOT exposed on the host — internal docker network only.

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    restart: unless-stopped
    environment:
      # Generate with: openssl rand -base64 32
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET must be set in .env}
      BETTER_AUTH_URL: https://${DOMAIN}/api/auth
      DATABASE_URL: file:/data/auth.sqlite
      PORT: "4300"
      AUTH_RATE_LIMIT_MAX: "5"
      AUTH_RATE_LIMIT_WINDOW: "900"
      # Feedback → Linear (optional). Empty/unset disables the in-app
      # feedback endpoint — see README § Feedback → Linear.
      LINEAR_API_TOKEN: ${LINEAR_API_TOKEN:-}
      # Optional overrides; empty falls back to the Nox/Arcan defaults
      # baked into api/src/env.ts.
      LINEAR_TEAM_ID: ${LINEAR_TEAM_ID:-}
      LINEAR_PROJECT_ID: ${LINEAR_PROJECT_ID:-}
      LINEAR_LABEL_FEEDBACK_ID: ${LINEAR_LABEL_FEEDBACK_ID:-}
      LINEAR_LABEL_BUG_ID: ${LINEAR_LABEL_BUG_ID:-}
      LINEAR_LABEL_IDEA_ID: ${LINEAR_LABEL_IDEA_ID:-}
      LINEAR_LABEL_QUESTION_ID: ${LINEAR_LABEL_QUESTION_ID:-}
      LINEAR_LABEL_NOTE_ID: ${LINEAR_LABEL_NOTE_ID:-}
    volumes:
      - ./auth-data:/data     # Better Auth's user/session SQLite — losing this means every user must re-create their account.
    # NOT exposed on the host — internal docker network only; reached via
    # Caddy's /api/auth/* reverse_proxy route.

volumes:
  caddy_data:
  caddy_config:
